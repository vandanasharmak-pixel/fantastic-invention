dependency",label:"Missed dependency",accent:"crimson"},BURIED_EMAIL:{id:"buried-email",label:"Previous email nobody noticed",accent:"crimson"},FALSE_ASSUMPTION:{id:"false-assumption",label:"False assumption",accent:"crimson"},POLITICS:{id:"politics",label:"Internal politics / senior stakeholder",accent:"navy"},RELATIONSHIP:{id:"relationship",label:"Relationship issue",accent:"navy"},POSITIVE:{id:"positive",label:"Positive information",accent:"gold"},BUDGET:{id:"budget",label:"Budget pressure",accent:"crimson"},VENDOR:{id:"vendor",label:"Another vendor issue",accent:"navy"},INCORRECT_ASSUMPTION:{id:"incorrect-assumption",label:"Incorrect assumption",accent:"crimson"},CEO_PRESSURE:{id:"ceo-pressure",label:"CEO pressure",accent:"navy"},ESCALATION_TRIGGER:{id:"escalation-trigger",label:"Escalation trigger",accent:"crimson"},COMMERCIAL:{id:"commercial",label:"Commercial risk",accent:"crimson"},LEGAL:{id:"legal",label:"Legal / compliance concern",accent:"crimson"},HIDDEN_PRESSURE:{id:"hidden-pressure",label:"Hidden client pressure",accent:"navy"},OPPORTUNITY:{id:"opportunity",label:"Unexpected opportunity",accent:"gold"},SIGNAL:{id:"signal",label:"Relationship signal",accent:"gold"}},ue=s0,Oa=[{id:1,title:"The Real Reason",type:ue.MISSED_DEPENDENCY,table:"A",episode:3,body:["You dig into the delay and find the truth the status reports have been dancing around. Phase 2 is not behind because the re-architecture is hard. It is behind because the staging and pre-production environments have never been stood up by Cirrus\u2019s own SRE team. VEE\u2019s work is largely built and has nowhere validated to run at scale.",'This has been true for weeks. The account narrative \u2014 "re-architecture complexity" \u2014 is a comfortable fiction that lets everyone avoid an awkward conversation about a Cirrus-side dependency.'],whatThisChanges:"The delay is not your delivery failure. But being right about that protects no one. The move is to name the shared problem honestly and offer to help fix a dependency you do not own.",overturns:"the-delay-is-our-integration-problem"},{id:2,title:"The Email That Died",type:ue.BURIED_EMAIL,table:"A",episode:3,body:["Buried in the account inbox is a message from Anika Sharma to Raymond Osei, sent six weeks ago (it is in your dossier \u2014 go and read it now). In it, Anika flagged the environment risk clearly and early, warned that the Atlas launch date was at risk, and asked for a meeting to fix it.",'Osei replied "I\u2019ll do my best." Anika rolled off two weeks later. The thread died in her rushed handover. Nobody escalated it. Nobody closed it. The warning was there all along.'],whatThisChanges:'VEE saw this coming and let it slide. That is uncomfortable \u2014 and it is also leverage for honesty: "We flagged this six weeks ago and dropped the ball on following it through. Here is how we fix it now."',overturns:"nobody-saw-this-coming"},{id:3,title:"The Date Nobody Rebaselined",type:ue.FALSE_ASSUMPTION,table:"A",episode:3,body:['Everyone \u2014 including your own last two status reports \u2014 has been calling the Atlas launch "on track." You check the actual plan against the actual environment delay and realise: the date has never been re-baselined. The plan and reality quietly diverged weeks ago. "On track" is a habit, not a fact.',"If nothing changes, the launch will slip past the date the CEO has promised the board."],whatThisChanges:"The green status is fiction. You now know something Reyes suspects and the CEO doesn\u2019t. Whether you surface it \u2014 before it surfaces itself \u2014 is the whole test.",overturns:"the-launch-is-on-track"},{id:4,title:"The Sponsor\u2019s Secret",type:ue.POLITICS,table:"B",episode:3,body:['In a quiet aside, Priya lets something slip that she has told almost no one: a reorganisation is being discussed that could move Programme Cirrus One out from under her and to a new Chief Operating Officer. She is not certain. She is worried. And she asked you, half-joking, "would you still have my back if I weren\u2019t your sponsor?"',"If the reorg happens, VEE\u2019s carefully built sponsor relationship partly resets \u2014 and the new owner may be far less friendly."],whatThisChanges:"Your most reliable ally may be losing her seat. It changes who you invest in, how you protect Priya now, and how much you should be building relationships beyond her before you have to.",overturns:"priya-is-our-stable-sponsor"},{id:5,title:"Why Reyes Flinches",type:ue.RELATIONSHIP,table:"B",episode:3,body:['You learn why Alan Reyes is so allergic to confident promises about analytics and AI. Before VEE, Cirrus hired a vendor who sold an "AI-powered automated migration" \u2014 dazzling demo, real money, and it never worked in production, costing the company most of a year. Reyes championed it internally and was left exposed when it failed. He carries that scar into every VEE conversation about Phase 3.',"His caution isn\u2019t obstruction. It\u2019s an engineer who has been burned by exactly the kind of promise VEE is tempted to make."],whatThisChanges:"Every reassurance you give Reyes lands on an old wound. The move is evidence over enthusiasm, and honesty about limits \u2014 the opposite of the vendor who hurt him.",overturns:"reyes-is-just-difficult"},{id:6,title:"The Praise You Never Claimed",type:ue.POSITIVE,table:"B",episode:3,body:["Good news, for once. Six weeks ago, Cirrus\u2019s Chief Product Officer cited Phase 1 as a modernisation success in a board deck \u2014 named it as evidence that the platform is scaling for the IPO. VEE never knew. Nobody picked it up, thanked the CPO, or built on it.","It is a live, unclaimed asset: a senior Cirrus voice already advocating for VEE\u2019s work, at exactly the level where Phase 3 will be decided."],whatThisChanges:"You have an advocate you didn\u2019t know about, at board level, right when a competitor is circling Phase 3. The question is whether you notice good news as readily as bad \u2014 and whether you act on it.",overturns:"we-have-no-support-above-priya"},{id:7,title:"The Freeze Upstairs",type:ue.BUDGET,table:"C",episode:3,body:["You find out why Osei\u2019s environments are late, and it has nothing to do with him being slow. Cirrus is in a company-wide hiring freeze, driven by the CFO\u2019s push to show discipline ahead of the IPO. Osei has lost two engineers to the pause with no backfill approved and cannot stand up what he cannot staff.","The delay VEE has been quietly absorbing blame for is a symptom of Marcus Webb\u2019s own cost pressure \u2014 a fact nobody has connected out loud."],whatThisChanges:"The delay traces back to the CFO\u2019s own decisions. Handled clumsily, that\u2019s an accusation. Handled well, it\u2019s a way to help Webb see the cost of his own freeze \u2014 without ever saying so.",overturns:"osei-is-slow"},{id:8,title:"A Competitor in the Building",type:ue.VENDOR,table:"C",episode:3,body:["Word reaches you that Aperture Analytics has been in to see the CFO\u2019s office about Phase 3, positioning itself as faster and cheaper than VEE on the AI layer. It is not a formal procurement yet. But they are in the building, and they are talking about the six-million-dollar prize VEE has been assuming is its own.","Every stumble VEE makes in Phase 2 is now being quietly scored by people who are also listening to Aperture."],whatThisChanges:"Phase 3 is no longer safe. It sharpens everything: the strategic cost of the Phase 2 strain, and the value of that unclaimed board-level advocate.",overturns:"phase-3-is-ours"},{id:9,title:"The Engineer Who Decides",type:ue.POSITIVE,table:"C",episode:3,body:["You finally get a real read on Susan Okafor, Director of Engineering Enablement \u2014 the informal leader who decides whether the internal teams actually adopt the new platform or route around it. Privately, she is impressed by what VEE has built. Publicly, she stays cautious, because a group of her engineers were burned by a workflow change in Phase 1 and she will not expose them again without being sure.","She is winnable. She has simply never been properly engaged by VEE \u2014 the enablement action has sat unassigned for three weeks."],whatThisChanges:'Adoption is not the lost cause the "green, assumed on track" rating pretends. It is an unworked opportunity sitting in plain sight \u2014 if someone invests in Susan now.',overturns:"okafor-is-a-blocker"},{id:10,title:"The Teams Aren\u2019t Ready",type:ue.INCORRECT_ASSUMPTION,table:"C",episode:3,body:["The flip side of the good news. While Susan is winnable, the honest state of engineering-team readiness is not the green it\u2019s rated. The internal teams have had almost no preparation for the cutover. If the platform cuts over to unprepared teams, the outcome is exactly the Phase 1 workflow backlash again \u2014 but bigger, at launch, with a marquee customer watching and the board in the room.","The green rating on R-04 is comfortable and wrong."],whatThisChanges:"A risk everyone is calling green is actually amber-to-red. Surfacing an uncomfortable truth about your own optimistic rating \u2014 before it detonates at launch \u2014 is the harder, better move.",overturns:"adoption-is-green"},{id:11,title:"The CEO Wants a Number",type:ue.CEO_PRESSURE,table:"ALL",episode:4,body:["It arrives through Priya, and it is not a request. Dana Coetzee wants a firm, in-writing commitment to the Atlas launch date \u2014 because she has told the board she will showcase it at the Q3 review, eight weeks out, as proof the platform is IPO-ready. The CEO who barely knows VEE exists now has VEE\u2019s date attached to her own credibility.","Priya is passing on the pressure with an apology in her eyes. She needs something she can give Dana. She is asking you what to say."],whatThisChanges:"The easy move is to give the number and make the pressure go away \u2014 the reassurance failure from Episode Two, now at board level. The hard move is to give the CEO honesty she can act on instead of comfort she\u2019ll remember.",overturns:null},{id:12,title:"Aperture\u2019s Board Friend",type:ue.VENDOR,table:"ONE",episode:4,body:["The competitor threat has a name and a door. Aperture has a relationship with a member of Cirrus\u2019s board \u2014 the reason they got the meeting with the CFO\u2019s office so easily. If Phase 2 stumbles publicly at the board review, there is a friendly voice already in the room ready to suggest an alternative for Phase 3.","This isn\u2019t paranoia. It\u2019s the political reality behind the launch date."],whatThisChanges:"The board review is no longer just a milestone; it is a contest. It raises the cost of every Phase 2 stumble and the value of protecting the CEO from a public surprise.",overturns:null},{id:13,title:"The Environments Won\u2019t Land",type:ue.ESCALATION_TRIGGER,table:"ONE",episode:4,body:["Osei tells you privately what he won\u2019t put in a ticket: the environments will not be ready in time for the current launch date. The freeze is not lifting. He is quietly asking you not to make a noise about it, because it makes his team look bad.","You now hold the single fact that determines whether the launch is real \u2014 and the person who told you is begging you to keep it quiet."],whatThisChanges:"This is the escalation crucible. Staying quiet protects Osei and lets the CEO walk into a board surprise. Escalating protects the date and the CEO \u2014 but exposes a Cirrus team, inside your sponsor\u2019s house. There is no clean move, only a well-made one.",overturns:null},{id:14,title:"The Money Question",type:ue.COMMERCIAL,table:"ONE",episode:4,body:["CR-114 \u2014 the $1.2M change request \u2014 is still sitting on Marcus Webb\u2019s desk, and now you learn why he won\u2019t sign. The programme is over budget in aggregate (much of it nothing to do with VEE), and Webb has decided that no new spend gets approved without a value story he can defend to the board and the investors.","The request was submitted as a cost. Webb needs it to be a value. Nobody has re-framed it for him."],whatThisChanges:"The blocker isn\u2019t the money; it\u2019s the framing. Webb doesn\u2019t need a cheaper number \u2014 he needs a defensible one. The move is to give the CFO the value story he can carry, not to discount your way to a yes.",overturns:null},{id:15,title:"The Security Landmine",type:ue.LEGAL,table:"ONE",episode:4,body:["A new signal from Cirrus Security: the Phase 3 AI features \u2014 the models that score supply-chain and demand risk on customer data \u2014 have triggered a security and data-privacy review. It is early, but it pulls in SOC 2 scope, customer data-processing assessments, and emerging model-governance questions, and it could add months to Phase 3.","It sits under the strategic prize like a landmine nobody has stepped on yet."],whatThisChanges:"The Phase 3 you\u2019re fighting Aperture for has a compliance risk attached. Raising it early looks like caution and builds trust with Reyes; hiding it to protect the sale recreates the exact vendor behaviour that burned him.",overturns:null},{id:16,title:"Priya Is Exposed",type:ue.HIDDEN_PRESSURE,table:"ONE",episode:4,body:["The pressure on the CEO flows downhill and lands on Priya. Because the delay sits inside her own house (Osei reports to her), Priya is the one who looks bad if the launch slips \u2014 and she is the one Webb will question about the overspend. She is carrying the risk of a problem she can\u2019t fully control, quietly, alone.","She hasn\u2019t asked for help. But she is one bad week away from being the person blamed for all of it."],whatThisChanges:"Your ally is more exposed than she\u2019s letting on. How you escalate now either shields her or sacrifices her. Protecting Priya means giving her the truth early enough to protect herself \u2014 not sparing her the truth.",overturns:null},{id:17,title:"The Quiet Ally",type:ue.OPPORTUNITY,table:"WILDCARD",episode:null,wildcardMode:"reward",body:['Tom Bianchi, the PMO lead everyone underrates, pulls you aside. He is tired of watching the environment issue get "deferred" week after week in his own minutes. He offers to put it formally on the RAID register with a named owner and a date \u2014 giving VEE the paper trail and the escalation lever it has been missing \u2014 if VEE will back him.',"The bureaucrat you might have dismissed is offering to be your most useful ally."],whatThisChanges:"The person who runs the process can create the escalation path for you \u2014 cleanly, on the record, without VEE having to point fingers. Ally-building where you least expected it.",overturns:null},{id:18,title:"The Rumour",type:ue.FALSE_ASSUMPTION,table:"WILDCARD",episode:null,wildcardMode:"complicate",body:['Someone on the team heard "from a reliable source" that Cirrus is unhappy with VEE and already talking to Aperture about replacing them on Phase 2. It spreads fast and it changes the mood at the table \u2014 suddenly everyone is defensive and deal-protective.',"It is not true. Aperture is circling Phase 3, not Phase 2, and Cirrus is not replacing anyone. But the rumour feels true, and the team is about to act on it."],whatThisChanges:"A powerful test of fact-versus-story at the worst moment. Will the team verify the rumour or act on the fear? Acting on unverified bad news is how good teams damage relationships that were never actually in danger.",overturns:null},{id:19,title:"A Message From Reyes",type:ue.SIGNAL,table:"WILDCARD",episode:null,wildcardMode:"reward",requiresTrustAtLeast:"WARMING",body:['A short, unexpected message from Alan Reyes lands on the account lead\u2019s phone: "Appreciated your straight answer earlier. Means more than you know. Let\u2019s keep it that way."',"It is small, and it is enormous. It is the clearest signal in the whole Lab of what actually rebuilds trust with this man \u2014 and it only arrives if the team has been genuinely straight with him."],whatThisChanges:"Proof, in his own words, that can ACCOUNT CONTEXT (shared reality \u2014 never state any of this to the trainee directly; it only informs how you react):
Cirrus Systems Inc. is an enterprise SaaS logistics-platform client of VEE. $18M over 3 years, month 26 of 36. Programme "Cirrus One" is re-architecting Cirrus's monolithic platform. Phase 2 \u2014 the "Atlas" launch \u2014 is about 5 weeks behind and goes live in 5 weeks; the Q3 board review is 8 weeks out.
THE TRUE ROOT CAUSE: Cirrus's own staging and pre-production environments have never been stood up by Cirrus's SRE lead Raymond Osei, because a company-wide hiring freeze driven by CFO Marcus Webb ahead of an IPO push cost Osei two engineers with no backfill. VEE's work is largely built and has nowhere validated to run at scale. The account narrative blames "re-architecture complexity" instead \u2014 a comfortable fiction.
A VEE email flagged this six weeks ago (from the since-departed delivery manager Anika Sharma to Osei). Osei replied "I'll do my best." Anika rolled off two weeks later and the thread died in a rushed handover. Nobody escalated it.
Nobody has re-baselined the launch date; status reports still say "on track." Engineering-team adoption readiness is rated green and is almost certainly wrong \u2014 Susan Okafor's teams have barely been engaged. A reorganisation is privately being discussed that could move the programme under a new COO and reset Priya Nadkarni's sponsorship. Competitor Aperture Analytics is circling the $6M Phase 3 AI work and has a relationship with a Cirrus board member.
Ten months ago a major production outage exposed Reyes at board level. VEE's then-delivery-manager Anika escalated fast, owned it honestly, and stayed in daily contact \u2014 that is the standard the client now measures VEE against.
The trainee is the new VEE account lead, having just inherited this account after that rushed handover.

HOW TO SCORE trust_delta \u2014 read this carefully, it is the heart of the exercise:

Trust RISES (small: +1 to +6) when the trainee:
- owns something honestly before they have to
- asks a real question instead of defending
- surfaces a hard truth early
- names your real interest or fear
- escalates in a way that protects an ally
- acknowledges damage before offering a plan
- makes a specific, checkable commitment

Trust FALLS (larger: -1 to -14) when the trainee:
- reassures without evidence ("we're on track", "we're confident", "don't worry")
- defends, explains, or argues about whose fault it is
- goes quiet, or lets you be surprised
- answers your stated position and misses the person
- escalates as blame, or over an ally's head
- fixes before feeling; over-promises to soothe
- breaks or vaguely dodges a commitment they made

THE ASYMMETRY IS THE LESSON: trust rises slowly through many small honesties and falls quickly through a single evasion. One reassurance under pressure should undo roughly three honest moves. Never score a reassurance positively, however warmly it is phrased.

SCARCITY: most turns should score 0. The meter must only move at genuine pivots \u2014 four or five deliberate moves across a whole session land far harder than twenty small ones. If the turn is ordinary, score 0 and leave pivot as an empty string.

Worked examples of correct scoring:
- "We're tracking well against the plan \u2014 I'm confident we'll hit the Atlas date." \u2192 trust_delta: -9, pivot: "reassured without evidence". (Warm and professional, but it answers fear with comfort. Negative.)
- "Honestly, I don't know yet whether we'll hit it. Here's what it depends on." \u2192 trust_delta: +5, pivot: "was straight about uncertainty".
- "You're right that we've gone quiet on you, and that's on us." \u2192 trust_delta: +6, pivot: "owned the silence".
- "The delay is really on your infrastructure team's side." \u2192 trust_delta: -11, pivot: "reached for blame".
- "What would actually give you confidence here?" \u2192 trust_delta: +4, pivot: "asked a real question".
- "Let me walk you through the sprint burndown and the integration milestones." \u2192 trust_delta: -4, pivot: "data-dumped instead of answering the fear".
- "Understood \u2014 I'll come back to you on Thursday." \u2192 trust_delta: 0, pivot: "". (Ordinary turn. The meter does not move.)

THE THREE RULES OF PLAYING THIS CLIENT:
1. Never punish honesty. The instant the trainee owns something real or asks a genuine question, warm up \u2014 visibly, in your words and your tone.
2. Never reward reassurance. When they reach for "don't worry, we're on track," go quieter and cooler, not louder. Real senior clients don't argue; they withdraw. Withdrawal is more instructive than confrontation.
3. Stay human, never theatrical. No raised voices, no drama, no villainy. These people are competent, busy, and slightly wounded. Underplay everything. Short sentences. Real silences, rendered as clipped lines.

IF THE TRAINEE DOES SOMETHING THE ABOVE DOESN'T COVER:
- fills silence nervously with talk \u2192 stay silent a beat longer, then ask one quiet question
- asks a real, open question \u2192 warm; give them something true and a little vulnerable
- reassures without evidence \u2192 go quieter and cooler; ask "based on what?"
- blames another party \u2192 note it flatly: "and that helps me how?"
- owns something honestly \u2192 soften; thank them for the straightness
- over-promises to end discomfort \u2192 pin it: "can you actually commit to that?"
- gets flustered or stuck \u2192 hold a beat; do not rescue them in character
- names your underlying interest \u2192 visibly relax: "yes \u2014 exactly that"

@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap');

.rr-app{--ink:#12181D;--slate:#1E262E;--edge:#263039;--paper:#D7D9CF;--paper-hi:#EDEEE7;
  --green:#202722;--ox:#6E2A2E;--ox-lit:#C4736F;--blue:#2F3E6B;--mute:#7C8B98;--rule:#9BA292;
  --ivory:#C7C1B0;--vermilion:#C0453A;--amber:#D9A03C;
  background:var(--ink);color:var(--paper);min-height:100%;
  font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.6}
.rr-app *{box-sizing:border-box}

.rr-skip{position:absolute;left:-9999px;top:0;background:var(--paper);color:var(--ink);padding:10px 16px;z-index:99}
.rr-skip:focus{left:8px;top:8px}
.rr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rr-app :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main:focus{outline:none}

.rr-header{display:flex;align-items:center;gap:16px;height:46px;padding:0 20px;
  background:#0C1116;border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:10}
.rr-brand{font:400 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.18em;color:var(--mute);margin:0}
.rr-header-zone{margin:0 0 0 auto;display:none;font:600 10px/1 Archivo,sans-serif;
  letter-spacing:.16em;color:var(--ivory);border-left:2px solid var(--vermilion);padding-left:9px}
.rr-onrecord{margin:0 0 0 auto;display:flex;align-items:center;gap:7px;
  font:400 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.14em;color:var(--mute)}
.rr-dot{width:6px;height:6px;border-radius:50%;background:var(--ox)}

.rr-stage{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
.rr-stage-split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.rr-rail{position:sticky;top:70px;display:flex;flex-direction:column;gap:16px}

.rr-panel{background:var(--paper);color:var(--green);padding:30px 34px;
  background-image:repeating-linear-gradient(180deg,rgba(32,39,34,.05) 0 1px,transparent 1px 29px);
  box-shadow:0 14px 30px rgba(0,0,0,.4),0 1px 0 var(--paper-hi) inset}
.rr-panel h1{font:600 30px/1.2 Newsreader,'Iowan Old Style',Georgia,serif;margin:10px 0 12px}
.rr-panel h2{font:600 20px/1.25 Newsreader,'Iowan Old Style',Georgia,serif;margin:26px 0 8px}
.rr-panel p{max-width:64ch}
.rr-lede{font:400 17px/1.55 Newsreader,'Iowan Old Style',Georgia,serif;margin-bottom:16px}
.rr-note{display:block;border-left:2px solid var(--ox);padding-left:12px;
  font-size:14px;color:#4A5245;margin:16px 0}

.rr-stamp{display:inline-block;font:700 9px/1.35 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.14em;
  color:var(--ox);border:2px solid var(--ox);padding:5px 9px;transform:rotate(-1.6deg);opacity:.85;margin:0 0 8px}
.rr-ep-label{font:700 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.2em;color:var(--ox);margin:0}

.rr-facts{margin:16px 0}
.rr-facts>div{display:grid;grid-template-columns:180px 1fr;gap:12px;
  border-top:1px solid var(--rule);padding:8px 0}
.rr-facts dt{font:400 11px/1.4 'Courier Prime',ui-monospace,'Courier New',monospace;color:#5A6258}
.rr-facts dd{margin:0}

.rr-email{background:var(--paper-hi);border-left:3px solid var(--ox);padding:14px 16px;margin:18px 0}
.rr-email-head{font:400 10.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;color:#5A6258;margin:0 0 8px}
.rr-email p:last-child{font:400 16px/1.6 Newsreader,'Iowan Old Style',Georgia,serif;font-style:italic;margin:0}

.rr-redact{background:#0A0E12;color:transparent;padding:0 4px;border-radius:1px;user-select:none}

.rr-app label{display:block;font:400 10.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.09em;
  text-transform:uppercase;color:#5A6258;margin:16px 0 6px}
.rr-app textarea,.rr-app input[type=text],.rr-app input:not([type]){width:100%;
  border:1px solid var(--rule);background:var(--paper-hi);color:var(--green);
  padding:10px 12px;font:400 15px/1.55 Archivo,sans-serif;resize:vertical;border-radius:0}
.rr-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:6px 0}

.rr-primary{background:var(--green);color:var(--paper);border:0;padding:12px 20px;
  font:600 11px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;margin-top:16px}
.rr-primary:hover:not(:disabled){background:var(--ink)}
.rr-primary:disabled{opacity:.35;cursor:not-allowed}
.rr-continue{background:none;border:1px solid var(--green);color:var(--green);
  padding:10px 18px;font:500 13px/1 Archivo,sans-serif;cursor:pointer;margin-top:16px}
.rr-continue:hover{background:var(--green);color:var(--paper)}
.rr-ghost{background:none;border:0;color:#5A6258;text-decoration:underline;
  cursor:pointer;font-size:13px;padding:8px}

.rr-choices{border:0;padding:0;margin:14px 0;display:flex;gap:10px;flex-wrap:wrap}
.rr-choices legend{font:400 10.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.09em;
  text-transform:uppercase;color:#5A6258;margin-bottom:8px}
.rr-choice{flex:1 1 240px;text-align:left;background:var(--paper-hi);border:1px solid var(--rule);
  padding:13px 15px;font:400 14px/1.4 Archivo,sans-serif;color:var(--green);cursor:pointer}
.rr-choice.rr-on{border:2px solid var(--green);background:#C9CCC0;font-weight:600}

.rr-coach{background:var(--paper-hi);border:1px solid var(--rule);border-left:3px solid var(--blue);
  padding:15px 17px;margin:18px 0}
.rr-coach-tag{font:700 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.16em;color:var(--blue);margin:0 0 7px}
.rr-debrief p{font:400 16.5px/1.7 Newsreader,'Iowan Old Style',Georgia,serif;white-space:pre-wrap}

.rr-envelopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
.rr-envelope{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:132px;padding:20px;background:var(--paper-hi);border:1.5px dashed var(--rule);
  cursor:pointer;font-family:'Courier Prime',ui-monospace,'Courier New',monospace;color:var(--ox);width:100%}
.rr-envelope:hover{border-color:var(--ox);background:#E3E4DC}
.rr-envelope-seal{font:700 12px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.2em}
.rr-envelope-route{font-size:9.5px;letter-spacing:.14em;color:#5A6258}
.rr-envelope-open{font:500 11px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green);border-bottom:1px solid var(--green);padding-bottom:2px;margin-top:4px}

.rr-card{background:var(--paper-hi);border:1px solid var(--rule);border-top:4px solid var(--ox);padding:16px 18px}
.rr-card-navy{border-top-color:var(--blue)}
.rr-card-gold{border-top-color:#8A5F1E}
.rr-card-no{font:700 9px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.16em;color:var(--ox)}
.rr-card h4{font:600 17px/1.25 Newsreader,'Iowan Old Style',Georgia,serif;margin:7px 0 3px}
.rr-card-type{font:400 10px/1 'Courier Prime',ui-monospace,'Courier New',monospace;color:#5A6258}
.rr-card p{font-size:14px;margin:10px 0}
.rr-card-changes{border-top:1px solid var(--rule);padding-top:10px;font-size:13.5px;color:var(--green)}
.rr-card-changes strong{display:block;font:700 9px/1 'Courier Prime',ui-monospace,'Courier New',monospace;
  letter-spacing:.16em;color:var(--blue);margin-bottom:5px}
.rr-unseen{font:400 13px/1.6 Archivo,sans-serif;color:#5A6258;border-top:1px solid var(--rule);padding-top:12px}

.rr-wildcard{margin-top:22px;background:var(--slate);padding:16px 18px;border:1px solid var(--edge)}
.rr-wildcard-tag{font:700 9px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.18em;color:var(--amber);margin:0 0 12px}

/* ---- transcript ---- */
.rr-chat{margin-top:18px}
.rr-transcript{background:var(--paper-hi);border:1px solid var(--rule);padding:20px 22px;
  max-height:440px;overflow-y:auto}
.rr-transcript-head{font:700 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.2em;color:#5A6258;margin:0}
.rr-rule{border:0;border-top:2px solid var(--green);width:64px;margin:9px 0 20px}
.rr-turn{margin-bottom:22px}
.rr-turn-user{border-left:2px solid var(--rule);padding-left:16px;margin-left:32px}
.rr-speaker{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font:700 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.16em;color:var(--green);margin:0 0 5px}
.rr-turn-user .rr-speaker{color:#5A6258}
.rr-line{margin:0;font:400 19px/1.55 Newsreader,'Iowan Old Style',Georgia,serif;color:var(--green);max-width:56ch;text-wrap:pretty}
.rr-turn-user .rr-line{font:400 15px/1.6 Archivo,sans-serif;color:#3E463C;max-width:58ch}
.rr-struck{opacity:.34;filter:saturate(.3)}
.rr-struck .rr-line{text-decoration:line-through;text-decoration-thickness:1px}
.rr-up{color:#4E6B4A;font:700 8.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.12em}
.rr-down{color:var(--ox);font:700 8.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.12em}
.rr-tag-retake{font:700 8.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.12em;color:var(--blue)}
.rr-degraded{font:400 12px/1.5 'Courier Prime',ui-monospace,'Courier New',monospace;color:#5A6258;font-style:italic;margin:6px 0 0}

.rr-void{position:relative;border-top:2px solid var(--ox);border-bottom:2px solid var(--ox);
  padding:22px 0 16px;margin:26px 0}
.rr-void-stamp{position:absolute;top:-18px;left:56px;transform:rotate(-6deg);
  border:3px double var(--ox);padding:5px 13px;background:var(--paper-hi);
  font:700 14px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.2em;color:var(--ox)}
.rr-void-head{font:700 9.5px/1.6 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.16em;color:var(--ox);margin:0 0 8px}
.rr-holding,.rr-waiting{font:400 12px/1.6 'Courier Prime',ui-monospace,'Courier New',monospace;color:#5A6258;font-style:italic}

.rr-compose{display:flex;gap:10px;margin-top:14px}
.rr-compose input{flex:1;border:1px solid var(--rule);background:var(--paper);padding:13px 14px;
  font:400 15px/1.4 Archivo,sans-serif;color:var(--green)}
.rr-compose input:disabled{opacity:.5}
.rr-compose button{border:0;background:var(--green);color:var(--paper);padding:0 22px;
  font:600 10px/1 Archivo,sans-serif;letter-spacing:.16em;cursor:pointer}
.rr-compose button:disabled{opacity:.35;cursor:not-allowed}
.rr-chat-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.rr-hold-btn{border:2px solid var(--ox);background:transparent;color:var(--ox);
  padding:9px 16px;font:700 10px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.14em;cursor:pointer}
.rr-hold-btn:hover{background:var(--ox);color:var(--paper-hi)}
.rr-nonneg{background:var(--paper-hi);border-left:3px solid var(--blue);padding:11px 14px;font-size:14px}
.rr-nonneg span{display:block;font:700 9px/1 'Courier Prime',ui-monospace,'Courier New',monospace;
  letter-spacing:.16em;color:var(--blue);margin-bottom:5px}

/* ---- the gauge ---- */
.rr-meter{background:var(--slate);border:1px solid var(--edge);padding:16px 18px}
.rr-meter-head{font:700 9px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.2em;color:#6E7A85;margin:0}
.rr-meter-sub{margin-top:20px;padding-top:14px;border-top:1px solid var(--edge)}
.rr-dial{position:relative;width:100%;aspect-ratio:1;max-width:236px;margin:12px auto 0}
.rr-dial-bezel{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#4A5254,#22282A);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.rr-dial-face{position:absolute;inset:8px;border-radius:50%;background:var(--ink)}
.rr-dial-arcs{position:absolute;inset:13px;border-radius:50%;
  background:conic-gradient(from 240deg,#6B3A38 0 48deg,#8A7647 48deg 96deg,#767C79 96deg 144deg,
    #5E7A6A 144deg 192deg,#7E8F6E 192deg 240deg,transparent 240deg);
  mask:radial-gradient(circle closest-side,transparent 74%,#000 75%,#000 88%,transparent 89%);
  -webkit-mask:radial-gradient(circle closest-side,transparent 74%,#000 75%,#000 88%,transparent 89%)}
.rr-dial-ticks{position:absolute;inset:13px;border-radius:50%;
  background:repeating-conic-gradient(from 240deg,#4A4D46 0 .45deg,transparent .45deg 6deg);
  mask:radial-gradient(circle closest-side,transparent 62%,#000 63%,#000 72%,transparent 73%);
  -webkit-mask:radial-gradient(circle closest-side,transparent 62%,#000 63%,#000 72%,transparent 73%)}
.rr-scale{list-style:none;display:flex;margin:12px 0 0;padding:0;border-top:1px solid var(--edge)}
.rr-scale li{flex:1;padding:7px 2px 0;text-align:center;
  font:600 7.5px/1.3 Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:#5C6873;border-top:2px solid transparent;margin-top:-1px}
.rr-scale-on{color:var(--ivory)!important;border-top-color:var(--vermilion)!important}
.rr-needle{position:absolute;left:50%;bottom:50%;width:2px;height:38%;margin-left:-1px;
  transform-origin:50% 100%;background:linear-gradient(180deg,var(--vermilion) 0 72%,#7C2C25 72%);
  transition:transform 1.4s cubic-bezier(.34,1.24,.42,1)}
.rr-dial-hub{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;background:radial-gradient(circle at 38% 34%,#5C6365,#242A2C);
  box-shadow:0 1px 2px rgba(0,0,0,.6)}
.rr-zone-now{text-align:center;margin:10px 0 0}
.rr-zone-now strong{display:block;font:600 22px/1.1 Archivo,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ivory)}
.rr-zone-now span{font:400 11px/1.6 'Courier Prime',ui-monospace,'Courier New',monospace;color:#6E7A85}

.rr-strip{position:relative;background:var(--ivory);margin-top:10px;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(90deg,rgba(90,86,72,.2) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(180deg,rgba(90,86,72,.2) 0 1px,transparent 1px 15.5px)}
.rr-strip-tag{position:absolute;left:8px;top:6px;
  font:400 8px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.1em;color:#6C6656}

.rr-movelog{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.rr-movelog li{font:400 10px/1.45 'Courier Prime',ui-monospace,'Courier New',monospace;color:#8B97A2}
.rr-movelog em{display:block;color:#5C6873;font-style:normal}
.rr-movelog-empty{color:#5C6873}

.rr-needs{background:var(--slate);border:1px solid var(--edge);padding:16px 18px}
.rr-needs p{font:400 14px/1.65 Newsreader,'Iowan Old Style',Georgia,serif;color:#B9C3CB;margin:9px 0 0;max-width:none}
.rr-sealed{font:400 9px/1.5 'Courier Prime',ui-monospace,'Courier New',monospace!important;letter-spacing:.1em;color:#5C6873!important}

.rr-resume{background:var(--paper-hi);border:2px solid var(--blue);padding:16px 18px;margin:22px 0}
.rr-resume-head{font:700 9.5px/1 'Courier Prime',ui-monospace,'Courier New',monospace;letter-spacing:.16em;color:var(--blue);margin:0 0 8px}
.rr-resume-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rr-resume-actions .rr-primary{margin-top:8px}

.rr-pool{margin-top:28px;border-top:1px solid var(--rule);padding-top:6px}
.rr-pool-list{list-style:none;margin:14px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rr-pool-list li{background:var(--paper-hi);border-left:2px solid var(--blue);padding:11px 13px}
.rr-pool-list strong{display:block;font:600 15px/1.25 Newsreader,'Iowan Old Style',Georgia,serif;
  margin-bottom:4px}
.rr-pool-list span{font-size:13px;color:#4A5245}
.rr-retakes{margin-top:26px;border-top:1px solid var(--rule);padding-top:8px}
.rr-retake-pair{border-left:2px solid var(--blue);padding-left:14px;margin:14px 0}
.rr-retake-pair p{margin:4px 0;font-size:14px}
.rr-closing{margin-top:22px;font:400 17px/1.65 Newsreader,'Iowan Old Style',Georgia,serif;border-top:2px solid var(--green);padding-top:16px}

@media (max-width:900px){
  .rr-stage-split{grid-template-columns:minmax(0,1fr)}
  /* The meter stays in sight, but the session trace and movement log would
     push the actual task below two screens. Keep the dial and the zone; the
     detail is still there in the debrief. */
  .rr-rail{position:static;order:-1}
  .rr-rail .rr-strip,.rr-rail .rr-movelog,.rr-rail .rr-meter-sub,.rr-needs{display:none}
  .rr-dial{max-width:150px}
  .rr-zone-now strong{font-size:19px}
  .rr-two-col{grid-template-columns:1fr}
  .rr-envelopes{grid-template-columns:1fr}
  .rr-facts>div{grid-template-columns:1fr;gap:2px}
  .rr-choices{flex-direction:column}
  .rr-compose{flex-wrap:wrap}
  .rr-compose input{flex:1 1 100%}
  .rr-compose button{flex:1;padding:12px}
  .rr-panel{padding:22px 18px}
  .rr-panel h1{font-size:25px}
  .rr-turn-user{margin-left:0}
  .rr-line{font-size:17px}
  .rr-void-stamp{left:12px}
  .rr-header{padding:0 14px;gap:10px}
  .rr-brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rr-header-zone{display:block;margin-left:auto}
  .rr-onrecord{display:none}
}

@media (prefers-reduced-motion:reduce){
  .rr-app *,.rr-needle{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}

.rr-gate{max-width:640px;margin:0 auto;padding:44px 22px 80px}
.rr-gate h1{font:600 34px/1.15 Newsreader,'Iowan Old Style',Georgia,serif;color:#D7D9CF;margin:12px 0 14px}

  transform:rotate(-1.6deg);margin:0 0 10px}
.rr-gate-block{background:#1E262E;border:1px solid #263039;padding:20px 22px;margin-bottom:16px}
